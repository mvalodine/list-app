<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple personal list app">
  <meta name="theme-color" content="#ffffff">

  <title>My List</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <main class="container">
    <h1>My List</h1>

    <form class="input-area" onsubmit="addItem(); return false;">
      <label for="itemInput">Add an item</label>
      <div>
        <input
          id="itemInput"
          name="item"
          type="text"
          placeholder="Add something..."
          autocomplete="off"
          required
        >
        <button type="submit">Add</button>
      </div>
    </form>

    <section aria-labelledby="listHeading">
      <h2 id="listHeading">Items</h2>
      <ul id="list" aria-live="polite"></ul>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
